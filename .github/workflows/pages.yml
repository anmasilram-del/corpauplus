name: Publicar Auto - GER v12.7
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar exclusivamente archivos públicos
        run: |
          mkdir -p site/vendor
          cp index.html app.js ui.css core.mjs exchange.mjs backup.mjs vault.mjs cleanup.mjs library.mjs classes.mjs annotations.mjs grade-report.mjs exam-tools.mjs pdf-output.mjs scan-pdf.mjs manifest.json sw.js icon-192.png icon-512.png icon.svg site/
          touch site/.nojekyll
          # Biblioteca PDF local, versión fija. No se reciben exámenes durante la construcción.
          npm pack pdfjs-dist@4.10.38 --ignore-scripts --pack-destination /tmp
          tar -xzf /tmp/pdfjs-dist-4.10.38.tgz -C /tmp package/legacy/build/pdf.mjs package/legacy/build/pdf.worker.mjs package/LICENSE
          cp /tmp/package/legacy/build/pdf.mjs /tmp/package/legacy/build/pdf.worker.mjs site/vendor/
          cp /tmp/package/LICENSE site/vendor/LICENSE-pdfjs.txt
          node --input-type=module --check < site/app.js
          for f in site/*.mjs site/sw.js; do node --check "$f"; done
          test -s site/vendor/pdf.mjs && test -s site/vendor/pdf.worker.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
